name: "Nível 2: Testes Automatizados"
on:
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  CHALLENGE_LEVEL: 2
  CHALLENGE_NAME: "testes-automatizados"
  COVERAGE_MIN: 80 # Cobertura mínima exigida em porcentagem

jobs:
  tests-and-coverage:
    name: "Testes e Cobertura"
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: Run tests with coverage gate (mínimo 80%)
        run: |
          node - <<'NODE'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          function run(cmd) {
            console.log(`\n$ ${cmd}`);
            execSync(cmd, { stdio: 'inherit' });
          }

          try {
            run('npm ci');
          } catch (e) {
            console.warn('npm ci falhou; tentando npm install...');
            run('npm install');
          }

          run('npm run tests');
          const candidates = [
            path.join('coverage', 'coverage-summary.json'),
            path.join('coverage', 'coverage-final.json')
          ];
          let coverageJson = null;
          for (const p of candidates) {
            if (fs.existsSync(p)) {
              coverageJson = JSON.parse(fs.readFileSync(p, 'utf8'));
              console.log(`\nCobertura carregada de: ${p}`);
              break;
            }
          }
          if (!coverageJson) {
            console.error('Não foi possível encontrar coverage-summary.json nem coverage-final.json.');
            process.exit(2);
          }

          const totals = coverageJson.total || coverageJson;
          function pctOf(metric) {
            const m = totals[metric];
            return (m && typeof m.pct === 'number') ? m.pct : null;
          }

          const current = {
            statements: pctOf('statements'),
            branches:   pctOf('branches'),
            functions:  pctOf('functions'),
            lines:      pctOf('lines'),
          };

          const thresholds = {
            statements: 80,
            branches:   80,
            functions:  80,
            lines:      80,
          };

          const rows = [
            ['Métrica',     'Atual (%)', 'Limite (%)', 'Status'],
            ['Statements',  current.statements, thresholds.statements, ''],
            ['Branches',    current.branches,   thresholds.branches,   ''],
            ['Functions',   current.functions,  thresholds.functions,  ''],
            ['Lines',       current.lines,      thresholds.lines,      ''],
          ];

          let fail = false;
          for (let i = 1; i < rows.length; i++) {
            const cur = rows[i][1];
            const thr = rows[i][2];
            const ok = cur !== null && cur >= thr;
            rows[i][3] = ok ? 'OK' : 'FAIL';
            if (!ok) fail = true;
          }

          const widths = [12, 12, 12, 8];
          function pad(s, w) { s = String(s); return s + ' '.repeat(Math.max(0, w - s.length)); }
          console.log('\nCobertura (Jest):\n');
          for (const r of rows) {
            console.log(
              pad(r[0], widths[0]),
              pad(r[1], widths[1]),
              pad(r[2], widths[2]),
              pad(r[3], widths[3]),
            );
          }

          if (fail) {
            console.error('\nCobertura abaixo de 80% em uma ou mais métricas.');
            process.exit(1);
          } else {
            console.log('\nCobertura >= 80% em todas as métricas.');
          }
          NODE
      - name: "Extrair porcentagem de cobertura" # Esse step será validado pelo desafio, não altere o nome. No final, ele deve gerar o output "coverage" com a porcentagem de cobertura.
        id: coverage
        run: |
          COVERAGE=$(npx nyc report --reporter=text-summary | grep -oP 'Statements\s*:\s*\K[0-9\.]+(?=%)' | head -1)
          echo "Coverage: $COVERAGE%"
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

  generate-certificate: # DAQUI PARA BAIXO, NÃO ALTERAR
      name: "Desafio Nível 2 - Certificado"
      runs-on: ubuntu-latest
      needs: tests-and-coverage
      if: success() && needs.tests-and-coverage.outputs.coverage != ''

      steps:
        - name: "Gerar certificado"
          run: |
            mkdir -p certificates
            cat > certificates/level-2-certificate.md << EOF
            # Certificado de Conclusão - Nível 2

            **Descomplicando Github Actions - GitHub Actions Edition**
            ---

            Este certificado atesta que **${{ github.actor }}** concluiu com sucesso:
            ## Nível 2: Testes Automatizados

            **Competências desenvolvidas:**
            - Automação de testes
            - Análise de cobertura
            - Lógica de validação com coverage mínimo
            - Upload de artefatos

            **Cobertura:** >= ${{ env.COVERAGE_MIN }}%
            **Data de conclusão:** $(date)
            **Repositório:** ${{ github.repository }}
            **Workflow:** ${{ github.run_id }}

            ---
            **Badge conquistado:** Testes Automatizados

            ---
            *Certificado gerado automaticamente pelo GitHub Actions*
            *LINUXtips*
            EOF

        - name: "Upload do certificado"
          uses: actions/upload-artifact@v4
          with:
            name: level-2-certificate
            path: certificates/
            retention-days: 30
